<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Manager</title>
    <link rel="stylesheet" href="../css/web1.css" />
</head>

<body>

    <!-- HEADER -->
    <div>
        <h1 class="text-4xl font-bold text-center">STUDENT MANAGER</h1>
        <P>Kelola Data Mahasiswa</P>
    </div>

    <!-- CARD INFO -->

    <div class="stats">
        <div class="stats-card">
            <h2>TOTAL MAHASISWA</h2>
            <p id="total-mahasiswa"></p>
        </div>
        <div class="stats-card">
            <h2>RATA-RATA NILAI</h2>
            <p id="rata-rata"></p>
        </div>
        <div class="stats-card">
            <h2>MAHASISWA LULUS</h2>
            <p id="mahasiswa-lulus"></p>
        </div>
        <div class="stats-card">
            <h2>NILAI TERTINGGI</h2>
            <p id="nilai-tertinggi"></p>
        </div>
    </div>


    <!-- SEACRH & FILTER -->
    <form class="seacrh">
        <input class="input-mhs" type="text" placeholder="Cari Mahasiswa..." />
        <select class="select-mhs">
            <option value="Semua">Semua V</option>
            <option value="lulus">Lulus</option>
            <option value="tidak-lulus">Tidak Lulus</option>
        </select>
    </form>

    <!-- CARD DAFTAR MAHASISWWA -->
    <div class="card-daftar" id="daftar-mahasiswa">
        <!-- <div class="fill">
            <div class="fill-nama">
                <h2>Affan</h2>
                <p>LULUS</p>
            </div>
            <div>
                <p>Informatika</p>
                <p>23 tahun</p>
            </div>
            <p>Nilai:</p>
            <div>
                <button>Detail</button>
                <button>Hapus</button>
            </div>
        </div> -->
    </div>

    <!-- Mahasiswa Terbaik -->
    <div class="mhs-terbaik">
        <h2>MAHASISWA TERBAIK</h2>
        <p id="terbaik-nama"></p>
        <p id="terbaik-nilai"></p>
        <p id="terbaik-jurusan"></p>
    </div>

    <button class="button-mhs">Lihat Mahasiswa Terbaik</button>

    <!-- ADD MAHASISWA -->
    <form class="add-mhs">
        <h1>TAMBAH MAHASISWA</h1>
        <div class="label">
            <label>Nama </label><span>:</span>
            <input type="text" id="nama" />
        </div>
        <div class="label">
            <label>Umur </label><span>:</span>
            <input type="text" id="umur" />
        </div>
        <div class="label">
            <label>Jurusan </label> <span>:</span>
            <input type="text" id="jurusan" />
        </div>
        <div class="label">
            <label>Nilai </label> <span>:</span>
            <input type="text" id="nilai" />
        </div>

        <button>Tambah</button>
    </form>

    <script src="../JS/web1.js"></script>
</body>

</html>
