<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Manager</title>
    <link rel="stylesheet" href="../css/web1.css" />
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <h1>STUDENT MANAGER</h1>
        <P>Kelola Data Mahasiswa</P>
    </div>

    <!-- CARD INFO -->

    <div class="stats">
        <div class="stats-card">
            <h2>TOTAL MAHASISWA</h2>
            <p></p>
        </div>
        <div class="stats-card">
            <h2>RATA-RATA NILAI</h2>
            <p></p>
        </div>
        <div class="stats-card" >
            <h2>MAHASISWA LULUS</h2>
            <p></p>
        </div>
        <div class="stats-card">
            <h2>NILAI TERTINGGI</h2>
            <p></p>
        </div>
    </div>
    

    <!-- SEACRH & FILTER -->
     <form class="seacrh">
        <input class="input-mhs" type="text" placeholder="Cari Mahasiswa..." />
        <select class="select-mhs">
            <option value="Semua">Semua V</option>
            <option value="lulus">Lulus</option>
            <option value="tidak-lulus">Tidak Lulus</option>
        </select>
     </form>

    
</body>
</html>
