<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product API Viewer</title>
  <link rel="stylesheet" href="../css/api.css">
</head>
<body>

  <main class="container">

    <header class="hero">
      <span class="badge">DAY 7 PROJECT</span>
      <h1>Product Explorer</h1>
      <p>
        Explore products from a public API using
        JavaScript Fetch and Async/Await.
      </p>
    </header>

    <section class="control-panel">
      <button id="load-btn">
        Load Products
      </button>
    </section>

    <p id="loading"></p>

    <p id="error"></p>

    <section id="product-list" class="product-grid">
      <!-- Product akan muncul di sini -->
    </section>

  </main>

  <script src="../js/promise.js"></script>
</body>
</html>
